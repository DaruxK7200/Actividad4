<div
  class="bg-white rounded-xl shadow-md p-6
         hover:shadow-xl transition-all duration-300">

  <h3 class="text-xl font-bold text-indigo-700">
    {{ producto.nombre | pipePersonalizado }}
  </h3>

  <p class="mt-2">
    Precio:
    <b>Bs. {{ producto.precio }}</b>
  </p>

  <p>
    Stock:
    <b>{{ producto.stock }}</b>
  </p>

  <p>
    Categoria:
    <b>{{ producto.nombreCategoria }}</b>
  </p>
  
  <button
  class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
  (click)="onEditar()">
  Editar
</button>

  <button
  class="mt-4 w-full bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition"
  (click)="onEliminar()">
  Eliminar
</button>

</div>
